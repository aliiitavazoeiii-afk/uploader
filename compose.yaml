name: video-share
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: '3000'
      DATA_DIR: /app/data
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set password in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set secret in .env}
      PUBLIC_BASE_URL: https://${PUBLIC_HOST:?Set public host in .env}
      MIN_FREE_BYTES: '1610612736'
    volumes:
      - ./data:/app/data
    expose:
      - '3000'
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  web:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set public host in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy_data:/data
      - ./caddy_config:/config
    depends_on:
      app:
        condition: service_started
